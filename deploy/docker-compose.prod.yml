# 生产环境覆盖配置
# 使用: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/uploads:/usr/share/nginx/html/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - frontend_dist:/app/dist:ro

  backend:
    environment:
      CORS_ORIGINS: "https://zhixumentu.com"
